<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCOAL / publications</title>
    <link rel="stylesheet" href="style.css?v=20261006-14">
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="canonical" href="https://michaeldo.dev/publications">

</head>
<body class="site-records site-publications">
    <div class="background"></div>
    <div class="prompt-container">
        <div class="prompt" onclick="location.href='index.html';" id="main_button">MYCOAL</div>
        <div class="prompt">/ publications</div>
    </div>
    <main class="records-file publications-file">
        <section class="publications-directory">
            <div class="directory-heading">
                <span>directory / publications</span>
                <span>01 entry</span>
            </div>
            <p class="publications-intro">Research notes and papers will live here once they're ready to leave the lab.</p>
            <article class="publication-status">
                <span>01</span>
                <div>
                    <small>draft_01.txt</small>
                    <strong>publication in progress</strong>
                    <p>Research is currently underway. This file will be updated when there's something ready to share.</p>
                </div>
                <em>pending</em>
            </article>
        </section>

        <figure class="records-illustration draggable-window" data-draggable-window>
            <div class="window-art">
                <img id="lofi_image_desk" src="desk.png" alt="A hand-drawn desk and lamp">
            </div>
        </figure>
    </main>
    <script src="script.js?v=20261006-7"></script>

</html>
